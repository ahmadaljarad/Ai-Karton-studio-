<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>AI Karton Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#f8fafc;font-family:system-ui,-apple-system,Arial,sans-serif}header{background:linear-gradient(125deg,#243b83,#111827);padding:27px 18px;text-align:center}h1{margin:0;font-size:27px}header p{color:#d4ddff;margin-bottom:0}main{max-width:800px;margin:auto;padding:16px}.card{background:#192338;border:1px solid #2c3b55;border-radius:17px;padding:18px;margin:14px 0}label{display:block;margin:13px 0 6px;font-weight:600}input,textarea,select{width:100%;border:1px solid #43516b;border-radius:10px;padding:12px;background:#0d1729;color:white;font:inherit}textarea{min-height:90px;resize:vertical}button{background:#697df5;border:0;border-radius:10px;padding:12px 16px;color:white;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#33445e}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #a5b4fc}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.actions button{flex:1;min-width:130px}.muted{color:#aab9d1;font-size:14px;line-height:1.7}.scene{border:1px solid #3b4b68;border-radius:12px;padding:14px;margin:12px 0;background:#111c30}.scene h3{margin:0 0 5px}.pill{display:inline-block;background:#293d69;padding:5px 10px;border-radius:20px;font-size:13px}.hidden{display:none}footer{text-align:center;color:#aab9d1;padding:20px;font-size:13px}
</style></head><body>
<header><h1>🎬 AI Karton Studio</h1><p>من الفكرة إلى مشاهد فيلمك — استوديو عربي مجاني</p></header>
<main>
<section class="card"><h2>مشروع فيلم جديد</h2>
<label for="title">اسم الفيلم</label><input id="title" placeholder="سر الصندوق المضيء">
<label for="story">القصة</label><textarea id="story" placeholder="اكتب القصة هون. كل جملة واضحة بتساعدنا نجهّز مشهداً مناسباً."></textarea>
<label for="style">نوع الفيلم</label><select id="style"><option>كرتون ثلاثي الأبعاد</option><option>كرتون ثنائي الأبعاد</option><option>فيلم واقعي</option></select>
<label for="language">اللغة</label><select id="language"><option>العربية السورية</option><option>الألمانية</option><option>الإنكليزية</option></select>
<label for="duration">مدة الفيلم</label><select id="duration"><option value="30">30 ثانية</option><option value="60" selected>دقيقة</option><option value="120">دقيقتان</option><option value="300">5 دقائق</option></select>
<div class="actions"><button id="generate">✨ جهّز المشاهد</button><button id="example" class="secondary">جرّب قصة سامر وفوفو</button></div>
<p class="muted">تقسيم مبدئي يعتمد على النص والمدة، وليس توليداً آلياً بالذكاء الاصطناعي بعد.</p></section>
<section id="output" class="card hidden"><h2 id="filmName"></h2><p id="info" class="muted"></p><div id="scenes"></div>
<div class="actions"><button id="save">💾 حفظ على الجهاز</button><button id="export" class="secondary">📄 تصدير السيناريو</button><button id="copy" class="secondary">📋 نسخ أوصاف الحركة</button></div><p id="notice" class="muted" aria-live="polite"></p></section>
</main><footer>النسخة 0.2 — يعمل محلياً في المتصفح، بدون رفع قصتك إلى خادم</footer>
<script>
const $=id=>document.getElementById(id);
let scenes=[];
const getSettings=()=>({title:$('title').value.trim(),story:$('story').value.trim(),style:$('style').value,language:$('language').value,duration:Number($('duration').value)});
function splitStory(story,count){
 const parts=story.split(/[.!؟\n]+/).map(s=>s.trim()).filter(Boolean);
 if(!parts.length)return Array(count).fill('');
 return Array.from({length:count},(_,i)=>parts[Math.min(parts.length-1,Math.floor(i*parts.length/count))]);
}
function promptFor(description,style){return 'Animate this scene in '+(style.includes('ثلاثي')?'cinematic 3D cartoon':style.includes('ثنائي')?'2D cartoon':'cinematic realistic')+' style. '+description+'. Smooth natural motion, stable character appearance, consistent lighting, no text, no subtitles.'}
function render(){
 const data=getSettings();$('filmName').textContent=data.title||'فيلم بدون عنوان';
 $('info').textContent=scenes.length+' مشاهد، مدة كل مشهد 10 ثوانٍ تقريباً. عدّل الوصف والحوار حسب رغبتك.';
 const root=$('scenes');root.replaceChildren();
 scenes.forEach((s,i)=>{
  const box=document.createElement('article');box.className='scene';
  const heading=document.createElement('h3');heading.textContent='المشهد '+(i+1);
  const time=document.createElement('span');time.className='pill';time.textContent=s.start+'–'+s.end+' ثانية';
  box.append(heading,time);
  [['الوصف', 'description'],['الحوار', 'dialogue'],['وصف التحريك بالإنكليزي (قابل للتعديل)','prompt']].forEach(([label,key])=>{
   const lab=document.createElement('label');lab.textContent=label;
   const area=document.createElement('textarea');area.value=s[key]||'';area.setAttribute('aria-label',label+' للمشهد '+(i+1));
   area.addEventListener('input',()=>{s[key]=area.value});
   box.append(lab,area);
  });
  root.append(box);
 });
 $('output').classList.remove('hidden');
}
$('generate').onclick=()=>{
 const d=getSettings();if(!d.title||!d.story){alert('اكتب اسم الفيلم والقصة أولاً');return}
 const count=Math.ceil(d.duration/10),parts=splitStory(d.story,count);
 scenes=parts.map((p,i)=>({start:i*10,end:Math.min((i+1)*10,d.duration),description:p,dialogue:'',prompt:promptFor(p,d.style)}));
 render();$('output').scrollIntoView({behavior:'smooth'});
};
$('example').onclick=()=>{
 $('title').value='سر الصندوق المضيء';
 $('story').value='كان سامر والثعلب فوفو يتمشّوا بالغابة. لمح سامر نوراً ذهبياً خلف شجرة كبيرة. قربوا بحذر ولقوا صندوقاً غريباً. سمعوا صوتاً لطيفاً من الصندوق. فتح سامر الغطاء وطلعت فراشات مضيئة. دلّتهم الفراشات على طريق العودة. رجعوا مبسوطين ووعدوا يحافظوا على سر الغابة.';
 $('generate').click();
};
$('save').onclick=()=>{
 try{localStorage.setItem('ai-karton-project',JSON.stringify({settings:getSettings(),scenes}));$('notice').textContent='انحفظ المشروع بهالمتصفح. انتبه: حذف بيانات المتصفح ممكن يمسحه.'}catch(e){$('notice').textContent='ما قدرنا نحفظ محلياً. استخدم تصدير السيناريو.'}
};
$('export').onclick=()=>{
 const d=getSettings(),lines=[d.title,d.style+' | '+d.language+' | '+d.duration+' ثانية','',...scenes.flatMap((s,i)=>['المشهد '+(i+1)+' ('+s.start+'–'+s.end+' ثانية)','الوصف: '+s.description,'الحوار: '+s.dialogue,'التحريك: '+s.prompt,''])];
 const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='film-script.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('copy').onclick=async()=>{
 const content=scenes.map((s,i)=>'Scene '+(i+1)+': '+s.prompt).join('\n\n');
 try{await navigator.clipboard.writeText(content);$('notice').textContent='تم نسخ أوصاف الحركة.'}catch(e){$('notice').textContent='النسخ غير متاح. استخدم تصدير السيناريو.'}
};
try{const saved=JSON.parse(localStorage.getItem('ai-karton-project')||'null');if(saved&&saved.settings&&Array.isArray(saved.scenes)){['title','story','style','language','duration'].forEach(k=>{if(saved.settings[k]!=null)$(k).value=saved.settings[k]});scenes=saved.scenes;render();$('notice').textContent='تم استرجاع آخر مشروع محفوظ.'}}catch(e){}
</script></body></html>
